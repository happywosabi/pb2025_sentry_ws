enemy_color: "red"
#enemy_color: "blue"


#####-----神经网络参数-----#####
yolo_name: yolov5
classify_model: assets/tiny_resnet.onnx
yolo11_model_path: assets/yolo11.xml
yolov8_model_path: assets/yolov8.xml
yolov5_model_path: assets/yolov5.xml
device: CPU
min_confidence: 0.8
use_traditional: true

#####-----ROI-----#####
roi: 
  x: 420
  y: 50
  width: 600
  height: 600

use_roi: false

#####-----USB相机参数-----#####
image_width: 1280
image_height: 720
fov_h: 57.7 #87.7
fov_v: 56.7 
new_fov_h: 27 #67
new_fov_v: 40.9
usb_frame_rate: 120
usb_exposure: 500 #1-80000______250
usb_gamma: 160
usb_gain: 10 #0-96

#####-----工业相机参数-----#####
camera_name: "hikrobot"
exposure_ms: 8
gain: 16.9
vid_pid: "2bdf:0001"

#####-----传统方法参数-----#####
threshold: 150
max_angle_error: 45 # degree
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25 # degree
min_confidence: 0.8

#####-----cboard参数-----#####
quaternion_canid: 0x01
bullet_speed_canid: 0x110
send_canid: 0xff
can_interface: "can0"

#####-----tracker参数-----#####
min_detect_count: 5
max_temp_lost_count: 25
outpost_max_temp_lost_count: 75

#####-----aimer参数-----#####
yaw_offset: -3 # degree -2.5
pitch_offset: -2  # degree 2
comming_angle: 60 # degree
leaving_angle: 20 # degree
left_yaw_offset: -1
right_yaw_offset: -0.6
decision_speed: 10 # rad/s
high_speed_delay_time: 0.080 # s
low_speed_delay_time: 0.040 # s

#####-----反陀螺中心瞄准参数-----#####
spin_center_track_speed: 6.0 # rad/s - 激活中心瞄准的角速度阈值(对面转速超过此值时yaw锁定车辆中心)
spin_fire_angle: 15 # degree - 装甲板朝向角度窗口(装甲板转到正面±N°内允许射击)

#####-----shooter参数-----#####
first_tolerance: 5 # 近距离射击容差，degree
second_tolerance: 2 # 远距离射击容差，degree
judge_distance: 3 #距离判断阈值
auto_fire: true # 是否由自瞄控制射击

#####-----寻敌模式参数-----#####
search_mode:
  enabled: true             # 是否启用寻敌模式
  lost_timeout: 3.0         # 丢失目标后进入寻敌模式的延迟(秒)
  yaw_speed: 1.5            # yaw旋转速度(rad/s，正=逆时针，负=顺时针)
  pitch_speed: 0.3          # pitch点头速度(rad/s)
  pitch_center: -0.05         # pitch中心角度(rad)
  pitch_amplitude: 0.15     # pitch上下幅度(rad)

#####-----decider参数-----#####
mode: 1

#####-----调试参数-----#####
debug:
  enable_visualization: true    # 是否启用可视化（发布/sentry_debug/image）
  enable_recorder: false         # 是否启用视频录制（records/目录）
  display_scale: 1.0            # 调试图像缩放比例（1.0=原始大小）

#####-----工业相机标定参数-----#####
R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]

# 重投影误差: 0.1870px
camera_matrix: [2391.9754203316666, 0, 805.47314519730128, 0, 2397.4515446944883, 637.60870693382958, 0, 0, 1]
distort_coeffs: [-0.0067938769855980944, -0.21041880690514908, 0.0095386505420377611, 0.0098308089316364727, 0]

# 相机同理想情况的偏角: yaw-1.11 pitch0.01 roll-0.06 degree
# 标定板到世界坐标系原点的水平距离: 1.20 m
# 标定板同竖直摆放时的偏角: yaw123.89 pitch14.05 roll-0.86 degree
R_camera2gimbal: [0.01928451708725664, 0.00012696140743255463, 0.99981402834802846, -0.99981344688553653, -0.0010834913551969569, 0.019284643459122196, 0.0010857382619952124, -0.99999940496346484, 0.00010604311483339372]
t_camera2gimbal: [0.13089617453251859, 0.0038468007459533785, 0.094139945222010288]